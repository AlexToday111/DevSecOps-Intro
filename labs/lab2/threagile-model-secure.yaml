threagile_version: 1.0.0

title: Juice Shop Secure Model
date: 2026-09-13

author:
  name: Student Name
  homepage: https://example.edu

management_summary_comment: >
  Hardened variant of the Juice Shop training architecture. This model preserves
  the baseline assets and flows, while adding encryption in transit, mutually
  authenticated proxy-to-application traffic, and encryption at rest.

business_criticality: important

business_overview:
  description: Training environment for DevSecOps threat-modeling practice.
  images: []

technical_overview:
  description: >
    A browser accesses Juice Shop directly or through a reverse proxy. Both
    inbound paths to the application are encrypted. The proxy authenticates to
    the application with a client certificate. Application and mounted storage
    use encryption at rest.
  images: []

questions:
  Do you expose port 3000 beyond localhost?: ""
  Do you use a reverse proxy with TLS and security headers?: ""
  Are any outbound integrations (webhooks) configured?: ""
  Is any sensitive data stored in logs or files?: ""

abuse_cases:
  Credential Stuffing: Attackers automate attempts to guess account credentials.
  Stored XSS: Malicious scripts are stored and later rendered in user browsers.
  SSRF: Server-side requests are abused to reach unintended network resources.

security_requirements:
  TLS in transit: Enforce HTTPS for all browser and proxy application traffic.
  Service authentication: Require client-certificate authentication between proxy and application.
  Encryption at rest: Encrypt the application runtime and persistent storage.
  AuthZ on sensitive routes: Enforce server-side role and permission checks.
  Rate limiting: Limit automated authentication attempts.

