    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored: []
    data_formats_accepted: [json]
    communication_links:
      To Reverse Proxy (preferred):
        target: reverse-proxy
        description: Browser to reverse proxy over HTTPS on port 443.
        protocol: https
        authentication: session-id
        authorization: enduser-identity-propagation
        tags: [primary]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent: [tokens-sessions]
        data_assets_received: [product-catalog]
