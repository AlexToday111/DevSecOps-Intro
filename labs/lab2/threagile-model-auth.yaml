threagile_version: 1.0.0

title: Juice Shop Login Flow
date: 2026-09-13
author:
  name: Student Name
  homepage: https://example.edu

management_summary_comment: >
  Feature-level model of the Juice Shop login and protected-admin path. It
  deliberately limits scope to credential verification, token issuance and
  verification, the credential store, and one authorisation-protected endpoint.

business_criticality: important
business_overview:
  description: Login and administrator authorisation are security-critical user flows.
  images: []
technical_overview:
  description: >
    The browser submits credentials to a login endpoint over HTTPS. The endpoint
    checks hashes in the credential store and asks a token service to issue a JWT.
    A protected admin endpoint sends the supplied JWT to the verifier, which uses
    the JWT signing key and role policy before allowing an administrative action.
  images: []

questions:
  Is multi-factor authentication enabled for privileged accounts?: ""
  Are JWT keys rotated and held outside application configuration?: ""
  Is the admin action audit log reviewed?: ""

abuse_cases:
  Credential stuffing: Automated attempts reuse leaked password pairs against the login endpoint.
  JWT forgery: An attacker obtains or guesses the signing key and creates an administrator token.
  Privilege escalation: A normal user attempts an admin action by manipulating roles or claims.
  Replay: A stolen bearer token is replayed before it expires or is revoked.

security_requirements:
  Credential protection: Transmit credentials only over HTTPS and store only salted password hashes.
  Token integrity: Protect, rotate, and restrict access to the JWT signing key.
  Least privilege: The admin endpoint must enforce a server-side administrator role check.
  Auditability: Log authentication and privileged-action outcomes without logging secrets.
  Brute-force resistance: Rate-limit logins and require MFA for privileged accounts.

tags_available:
  - browser
  - auth
  - jwt
  - credentials
  - admin
  - pii
  - secrets
  - audit
  - database
  - service
  - privileged
  - token-validation

data_assets:
  Login Credentials:
    id: login-credentials
    description: Email and password submitted during sign-in; passwords are stored only as hashes.
    usage: business
    tags: [credentials, auth, pii]
    origin: user-supplied
    owner: Lab Owner
    quantity: many
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Password disclosure enables account takeover and password-hash tampering can lock out users.
  JWT Access Token:
    id: jwt-access-token
    description: Signed bearer JWT containing subject, role, issue time, expiry, and audience claims.
    usage: business
    tags: [jwt, auth, token-validation]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: A token is a bearer credential; forgery or disclosure enables impersonation.
  JWT Signing Key:
    id: jwt-signing-key
    description: Dedicated secret used by the token issuer and verifier to sign and validate JWTs.
    usage: devops
    tags: [jwt, secrets]
    origin: application
    owner: Lab Owner
    quantity: few
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: important
    justification_cia_rating: Disclosure or modification lets an attacker forge identities and elevated roles.
  Account Roles:
    id: account-roles
    description: User-to-role mapping and server-side policy identifying administrators.
    usage: business
    tags: [auth, admin, privileged]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: internal
    integrity: mission-critical
    availability: important
    justification_cia_rating: Role integrity is decisive for authorisation of privileged operations.
  Authentication Audit Log:
    id: auth-audit-log
    description: Timestamped login, token-validation, and admin-authorisation events with outcome and correlation ID.
    usage: devops
    tags: [audit]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: internal
    integrity: critical
    availability: important
    justification_cia_rating: Tamper-resistant logs are needed to investigate disputed authentication and admin actions.

technical_assets:
  User Browser:
    id: user-browser
    description: User-controlled browser presenting the login form and calling the protected admin route.
    type: external-entity
    usage: business
    used_as_client_by_human: true
    out_of_scope: false
    justification_out_of_scope:
    size: system
    technology: browser
    tags: [browser]
    internet: true
    machine: virtual
    encryption: none
    owner: External User
    confidentiality: public
    integrity: operational
    availability: operational
    justification_cia_rating: The client can be controlled by an attacker and is outside the service trust boundary.
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: [login-credentials, jwt-access-token]
    data_assets_stored: [jwt-access-token]
    data_formats_accepted: [json]
    communication_links:
      Submit Credentials:
        target: login-endpoint
        description: HTTPS POST of credentials to the login endpoint.
        protocol: https
        authentication: credentials
        authorization: enduser-identity-propagation
        tags: [auth]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent: [login-credentials]
        data_assets_received: [jwt-access-token]
      Request Admin Action:
        target: admin-endpoint
        description: HTTPS request carrying a JWT to a server-side protected administrator action.
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags: [admin, privileged]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent: [jwt-access-token]
        data_assets_received: []

  Login Endpoint:
    id: login-endpoint
    description: Application endpoint that receives credentials and orchestrates sign-in.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: web-service-rest
    tags: [auth, service]
    internet: false
    machine: container
    encryption: transparent
    owner: Lab Owner
    confidentiality: internal
    integrity: critical
    availability: important
    justification_cia_rating: It is the internet-facing decision point for identity verification.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed: [login-credentials, account-roles, jwt-access-token, auth-audit-log]
    data_assets_stored: []
    data_formats_accepted: [json]
    communication_links:
      Check Password Hash:
        target: credential-store
        description: Mutually authenticated encrypted lookup of the account password hash and role.
        protocol: jdbc-encrypted
        authentication: client-certificate
        authorization: technical-user
        tags: [database, auth]
        vpn: false
        ip_filtered: true
        readonly: true
        usage: business
        data_assets_sent: [login-credentials]
        data_assets_received: [account-roles]
      Request JWT:
        target: token-service
        description: Mutually authenticated encrypted request to issue a signed JWT after successful verification.
        protocol: https
        authentication: client-certificate
        authorization: technical-user
        tags: [jwt, auth]
        vpn: false
        ip_filtered: true
        readonly: false
        usage: business
        data_assets_sent: [account-roles]
        data_assets_received: [jwt-access-token]

  Token Service:
    id: token-service
    description: Internal service that signs short-lived JWTs and verifies JWT claims for protected endpoints.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: web-service-rest
    tags: [jwt, auth, service]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: important
    justification_cia_rating: Compromise affects every issued identity and privilege claim.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed: [jwt-access-token, jwt-signing-key, account-roles, auth-audit-log]
    data_assets_stored: [jwt-signing-key]
    data_formats_accepted: [json]
    communication_links: {}

  Credential Store:
    id: credential-store
    description: Internal database holding salted password hashes and account-role mappings.
    type: datastore
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: identity-store-database
    tags: [credentials, database, auth]
    internet: false
    machine: virtual
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: important
    justification_cia_rating: Holds the password-verifier material and authorisation data.
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored: [login-credentials, account-roles]
    data_formats_accepted: [json]
    communication_links: {}

  Admin Endpoint:
    id: admin-endpoint
    description: Protected server-side endpoint for administrator actions; it allows the action only after verifier confirms an administrator role.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: web-service-rest
    tags: [admin, privileged, auth]
    internet: false
    machine: container
    encryption: transparent
    owner: Lab Owner
    confidentiality: internal
    integrity: mission-critical
    availability: important
    justification_cia_rating: Administrative actions require strict server-side authorisation and accountability.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed: [jwt-access-token, account-roles, auth-audit-log]
    data_assets_stored: [auth-audit-log]
    data_formats_accepted: [json]
    communication_links:
      Validate JWT and Role:
        target: token-service
        description: Mutually authenticated verification of JWT signature, expiry, audience, and administrator role.
        protocol: https
        authentication: client-certificate
        authorization: technical-user
        tags: [jwt, token-validation, admin]
        vpn: false
        ip_filtered: true
        readonly: true
        usage: business
        data_assets_sent: [jwt-access-token]
        data_assets_received: [account-roles]

